name: Check skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint skills (frontmatter, skill references, links, executable scripts)
        run: scripts/check-skills
      - name: babysit-pr watcher tests
        run: python .agents/skills/babysit-pr/tests/test_pr_wait.py
      - name: Shell syntax of bundled scripts
        run: |
          for f in .agents/skills/*/scripts/* .agents/skills/*/*.sh; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q 'bash\|/sh' || continue
            bash -n "$f" && echo "ok $f"
          done
